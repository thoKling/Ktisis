name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.1-stable
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "a76fd0fe1d44a2dd6c065b6f7b434ad75f5593c07bda3d3017f8304f2d069acbcf0f39cb5d0976f0434b56e9ea852032ddbcbdb7e0ce1c75a47e1dacb6794bd7  godot.zip" | sha512sum --check
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot

      - name: Importer le projet
        run: timeout 120 ./godot --headless --editor --quit --path . || true

      - name: Tests de la simulation
        run: |
          set -o pipefail
          timeout 600 ./godot --headless --path . -s res://tests/run.gd 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR|Parse Error" tests.log

      - name: Test de fumée (scène principale, clics simulés)
        run: |
          set -o pipefail
          timeout 120 ./godot --headless --path . -s res://tests/presentation/smoke.gd 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log
